name: AAPS-CI

on:
  workflow_dispatch:
    inputs:
      aaps_version:
        description: 'Select AAPS Version'
        required: true
        default: '3.4.2.6'
      build_variant:
        description: 'Select Build Variant'
        required: true
        default: 'FullRelease'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # ビルド実行前に全モジュールの Vector XML 内の ?attr/... を #FFFFFF へ自動置換
      - name: Replace dynamic theme attributes in Vector Drawables
        run: |
          find . -type f -path "*/src/main/res/drawable*/*.xml" -exec sed -i -E 's/"\?attr\/[^"]+"/"#FFFFFF"/g' {} +

      - name: Build with Gradle
        run: ./gradlew clean assemble${{ github.event.inputs.build_variant }} --stacktrace --no-build-cache
