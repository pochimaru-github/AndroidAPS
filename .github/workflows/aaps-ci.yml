name: AAPS-CI

on:
  workflow_dispatch:
    inputs:
      aaps_version:
        description: 'Select AAPS Version'
        required: true
        default: '3.4.2.6'
      build_variant:
        description: 'Select Build Variant'
        required: true
        default: 'FullRelease'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Replace dynamic theme attributes in Vector Drawables
        run: |
          find . -type f -path "*/src/main/res/drawable*/*.xml" -exec sed -i -E 's/"\?([^"]+)"/"#FFFFFF"/g' {} +
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: temporary replace vector drawable attributes for build" || true

      - name: Build with Gradle
        run: ./gradlew clean assemble${{ github.event.inputs.build_variant }} --stacktrace --no-build-cache --no-daemon --no-parallel -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
