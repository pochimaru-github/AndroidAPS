name: AAPS-CI
on:
  workflow_dispatch:
    inputs:
      aaps_version:
        description: 'Select AAPS Version'
        required: true
        default: '3.4.2.6'
      build_variant:
        description: 'Select Build Variant'
        required: true
        default: 'fullRelease'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Build with Gradle
        run: ./gradlew assembleFullDebug
          
     // - name: Build with Gradle
      //  run: ./gradlew assembleFullRelease
        
