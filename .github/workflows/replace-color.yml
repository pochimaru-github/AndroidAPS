name: Replace Color Control Normal

on:
  workflow_dispatch:

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace colorControlNormal with #FFFFFF
        run: |
          find . -type f -name "*.xml" -exec sed -i 's/\?attr\/colorControlNormal/#FFFFFF/g' {} +

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Fix: Replace colorControlNormal with #FFFFFF in vector drawables" && git push)
