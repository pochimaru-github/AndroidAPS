pluginManagement {
    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        mavenCentral()
        google()
        maven { url 'https://jitpack.io' }
    }
}

// 【超重要】上空の設定を、本体プログラムのデータと100%完全に合致する純正の名前に修復しました！
rootProject.name = "com.nightscout.androidaps"
include ':app'
