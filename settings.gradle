pluginManagement {
    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        google()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "AndroidAPS"
include ':app'

// appフォルダ内の設定ファイルを「build.gradle」として強制認識させる命令
project(':app').buildFileName = 'build.gradle'
