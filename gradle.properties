# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# CI環境での並列ワーカー競合を防止（2コア環境用に制限）
org.gradle.parallel=false
org.gradle.workers.max=2

org.gradle.warning.mode=all
org.gradle.jvmargs=-Xmx8g -XX:+UseParallelGC -Xss1024m --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
kotlin.daemon.jvm.options=-Xmx2g

android.enableJetifier=false
android.useAndroidX=true

# AGP 7.x 移行に伴うリソース設定の最適化
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kapt.incremental.apt=false

# Kapt 固有の JVM オプションとリフレクション許可
kapt.jvm.args=-Xmx2048m --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

# Kotlin メタデータ互換モード
kapt.kotlin.generated=build/generated/source/kapt

# AAPT2 デーモンクラッシュ防止
android.enableAapt2Daemon=false

kapt.kotlin.language.version=1.9
kapt.kotlin.api.version=1.9
